# Host nginx reverse proxy for thesunsetbeachsip.ddns.net -> two sibling
# `docker compose` projects on this VPS, path-routed on one domain:
#   - the Next.js app (sunset-beach), published on 127.0.0.1:3000
#   - the sunset (Spring Boot) API, published on 127.0.0.1:8082, under /api/
#     (its own server.servlet.context-path is already /api, so no rewrite
#     is needed here — /api/rooms proxies straight to /api/rooms on 8082).
#     Room images resolve to /api/uploads/... too (see lib/backend.ts's
#     resolveImageUrl), so they fall under this same location — no separate
#     /uploads rule needed. Auth now lives on sunset too (/api/auth/login,
#     /api/auth/register, /api/auth/me), so it falls under this same
#     general /api/ rule — no carve-out needed for it any more.
#   - /api/session/ is carved out ahead of the general /api/ rule and sent
#     to the Next.js container instead — these are this app's own cookie
#     routes (app/api/session/{login,logout,register}/route.ts), which set
#     the httpOnly session cookie after Next.js exchanges credentials with
#     sunset's /api/auth/login on the server side.
#
# Plain HTTP on port 8888, not 80/443: this VPS's ISP blocks inbound 80/443,
# so there is no TLS here and no Let's Encrypt involved (see DEPLOY.md for
# the historical 80/443 + Let's Encrypt version of this file, kept as
# reference for a deployment with an unfiltered public IP, and for the
# Cloudflare Tunnel alternative note).
#
# Install: copy this file to /etc/nginx/conf.d/app.conf on the VPS, then
# `nginx -t && systemctl reload nginx`. No certificate needed.

# Allow larger multi-file room image uploads (default nginx limit is 1MB).
client_max_body_size 20m;

server {
    listen 8888;
    listen [::]:8888;
    server_name thesunsetbeachsip.ddns.net;

    # This app's own session-cookie routes — must come before the general
    # /api/ rule below so this more specific prefix wins.
    location /api/session/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # sunset (Spring Boot) API — everything else under /api/.
    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required so Next.js sees the real client IP/protocol/host instead
        # of the internal proxy hop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / keep-alive support (Next.js dev HMR, future use).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
