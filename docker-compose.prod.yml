services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published to loopback only (never to the internet) so the sunset
    # (Spring Boot) service — a separate `docker compose` project on this
    # same VPS — can reach it via host.docker.internal:5432. If Postgres runs
    # somewhere else instead (managed DB, separate host), remove this and
    # point sunset's DATABASE_URL there directly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # $$ (escaped) so this is expanded by the container's shell against
      # its own env (from env_file above), not by docker-compose itself —
      # compose-level interpolation would instead pull from a stray local
      # .env file, if one happens to exist in the project directory.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are baked into the client bundle at build time, so
      # this has to come from the shell (or a compose-level .env file) when
      # you run `docker compose -f docker-compose.prod.yml build` — it is
      # NOT read from .env.production, which is only wired up at container
      # start via env_file below.
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost only — the host's nginx reverse-proxies
    # prostak59.duckdns.org to 127.0.0.1:3000, so the app port is never
    # exposed directly to the internet.
    ports:
      - "127.0.0.1:3000:3000"
    # Lets server-side fetches (BACKEND_API_URL) reach the sunset (Java)
    # container, which is a separate `docker compose` project bound to
    # 127.0.0.1:8080 on this same host — see .env.production.example.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal

  # One-off seeding helper (initial admin account + demo rooms). Not started
  # by `up`; run explicitly with:
  #   docker compose -f docker-compose.prod.yml run --rm seed
  # Uses the `builder` stage because the production `app` image is
  # intentionally slim and doesn't ship tsx/dev dependencies.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles:
      - seed
    env_file:
      - .env.production
    command: ["npm", "run", "db:seed"]
    networks:
      - internal

networks:
  internal:
    name: sunset-beach-internal

volumes:
  db-data:
