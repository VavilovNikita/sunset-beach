# Postgres is NOT defined in this file. In this VPS's real topology it is a
# shared resource: the same Postgres instance (and the same Docker network,
# name below) is brought up by a separate `docker compose` project — this
# repo's own `docker-compose.yml` deployed standalone on the host — and is
# also used by the sibling `sunset` (Spring Boot) service, a third,
# independent compose project. Neither `app` nor `seed` below own that
# container or its data volume; they only join its network as a client.
#
# IMPORTANT: because `db` is not defined here, `docker compose -f
# docker-compose.prod.yml down` only stops/removes what this file actually
# owns (`app`, `seed`) — it will not touch Postgres. Do NOT add a `db`
# service back into this file "for convenience": that would create a second
# compose project claiming ownership of the same containers/volumes as the
# `docker-compose.yml` project, and a `down` run from either project could
# then take the shared database out from under the other one.
#
# DB_NETWORK_NAME must match whatever network name the shared Postgres
# project actually publishes (Compose's default is `<project-dir>_default`,
# i.e. `sunset-beach_default` for a checkout of this repo's own
# docker-compose.yml with no explicit `name:`) — override it in the
# compose-level `.env` file if that project uses something else, or if the
# sunset backend needs reaching by container name too (see
# .env.production.example for BACKEND_API_URL).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are baked into the client bundle at build time, so
      # this has to come from the shell (or a compose-level .env file) when
      # you run `docker compose -f docker-compose.prod.yml build` — it is
      # NOT read from .env.production, which is only wired up at container
      # start via env_file below.
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL}
    restart: unless-stopped
    env_file:
      - .env.production
    # Bound to localhost only — the host's nginx reverse-proxies
    # prostak59.duckdns.org to 127.0.0.1:3000, so the app port is never
    # exposed directly to the internet.
    ports:
      - "127.0.0.1:3000:3000"

  # One-off seeding helper (initial admin account + demo rooms). Not started
  # by `up`; run explicitly with:
  #   docker compose -f docker-compose.prod.yml run --rm seed
  # Uses the `builder` stage because the production `app` image is
  # intentionally slim and doesn't ship tsx/dev dependencies.
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles:
      - seed
    env_file:
      - .env.production
    command: ["npm", "run", "db:seed"]

networks:
  # Both services above use the default network, pointed at the shared,
  # externally-managed one instead of a project-local network Compose would
  # otherwise create.
  default:
    name: ${DB_NETWORK_NAME:-sunset-beach_default}
    external: true
