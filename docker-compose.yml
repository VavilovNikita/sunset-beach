services:
  # Local-dev Postgres for the sunset (Spring Boot) API, which now owns the
  # entire schema (all tables, including the User/auth table) and its own
  # migrations. This Next.js app (sunset-beach) has no direct database
  # connection any more — all data and auth go through sunset's HTTP API.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunsetbeach
      POSTGRES_PASSWORD: sunsetbeach
      POSTGRES_DB: sunsetbeach
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
